<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contacter le professeur</title>
 <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 400px; border: 2px solid black; }
        input, textarea { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        input[type="submit"] { background-color: silver; color: white; border: none; cursor: pointer; }
        input[type="submit"]:hover { background-color: black; }
        a { color: silver; text-decoration: none; }
    </style>
</head>
<body>

    <h2>Envoyer un message au professeur</h2>

    <form>
        <label>Nom :</label>
        <input type="text" name="nom" required>

        <label>Email :</label>
        <input type="email" name="email" required>

        <label>Message :</label>
        <textarea name="message" rows="5" required></textarea>

        <input type="submit" value="Envoyer">
    </form>

    <p><a href="Emploi du tempt.html"> ~ Retour à l'emploi du temps</a></p>

</body>
</html>
